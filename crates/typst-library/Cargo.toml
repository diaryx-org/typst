[package]
name = "typst-library"
description = "Typst's standard library."
version = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
readme = { workspace = true }

[dependencies]
typst-assets = { workspace = true }
typst-macros = { workspace = true }
typst-syntax = { workspace = true }
typst-timing = { workspace = true }
typst-utils = { workspace = true }
arrayvec = { workspace = true }
az = { workspace = true }
bitflags = { workspace = true }
bumpalo = { workspace = true }
ciborium = { workspace = true, optional = true }
codex = { workspace = true }
comemo = { workspace = true }
csv = { workspace = true, optional = true }
ecow = { workspace = true }
either = { workspace = true }
flate2 = { workspace = true }
fontdb = { workspace = true }
glidesort = { workspace = true }
hayagriva = { workspace = true, optional = true }
hayro-syntax = { workspace = true, optional = true }
icu_properties = { workspace = true }
image = { workspace = true }
indexmap = { workspace = true }
kamadak-exif = { workspace = true }
kurbo = { workspace = true }
libm = { workspace = true }
lipsum = { workspace = true }
memchr = { workspace = true }
moxcms = { workspace = true }
palette = { workspace = true }
percent-encoding = { workspace = true }
phf = { workspace = true }
png = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
regex-syntax = { workspace = true }
roxmltree = { workspace = true }
rust_decimal = { workspace = true }
rustc-hash = { workspace = true }
rustybuzz = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }
siphasher = { workspace = true }
smallvec = { workspace = true }
syntect = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
ttf-parser = { workspace = true }
two-face = { workspace = true }
typed-arena = { workspace = true }
unicode-math-class = { workspace = true }
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }
unscanny = { workspace = true }
usvg = { workspace = true }
utf8_iter = { workspace = true }
wasmi = { workspace = true, optional = true }
xmlwriter = { workspace = true }

# diaryx-org: each part of the library that brings crates of its own, behind a
# feature, all on by default. See PATCH.md, "Feature gates".
[features]
default = ["bibliography", "plugin", "csv", "yaml", "cbor", "pdf-images"]
# `bibliography` and `cite` read and render works, with Hayagriva. Without it,
# both elements exist and can be styled, but loading a bibliography fails.
bibliography = ["dep:hayagriva", "yaml"]
# `plugin`: WebAssembly plugins, with wasmi.
plugin = ["dep:wasmi"]
# The `csv`, `yaml` and `cbor` data loaders.
csv = ["dep:csv"]
yaml = ["dep:serde_yaml"]
cbor = ["dep:ciborium"]
# A PDF page as an image, with hayro-syntax.
pdf-images = ["dep:hayro-syntax"]

[dev-dependencies]
typst-dev-assets = { workspace = true }

[lints]
workspace = true
