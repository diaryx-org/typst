[package]
name = "typst"
description = "A new markup-based typesetting system that is powerful and easy to learn."
categories = ["compilers", "science"]
keywords = ["markup", "typesetting", "typst"]
version = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }

[dependencies]
typst-eval = { workspace = true }
typst-html = { workspace = true }
typst-layout = { workspace = true }
typst-library = { workspace = true }
typst-macros = { workspace = true }
typst-realize = { workspace = true }
typst-syntax = { workspace = true }
typst-timing = { workspace = true }
typst-utils = { workspace = true }
arrayvec = { workspace = true }
comemo = { workspace = true }
ecow = { workspace = true }
rustc-hash = { workspace = true }

# diaryx-org: typst-library's feature gates, all on by default, as upstream
# has them. See PATCH.md, "Feature gates".
[features]
default = ["bibliography", "plugin", "csv", "yaml", "cbor", "pdf-images"]
bibliography = ["typst-library/bibliography"]
plugin = ["typst-library/plugin"]
csv = ["typst-library/csv"]
yaml = ["typst-library/yaml"]
cbor = ["typst-library/cbor"]
pdf-images = ["typst-library/pdf-images", "typst-html/pdf-images"]

[lints]
workspace = true
